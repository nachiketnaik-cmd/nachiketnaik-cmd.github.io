<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The One Thing List</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1f1d1a; --muted:#8a847b;
    --line:#e7e3db; --accent:#3a7d5d; --accent-ink:#ffffff;
    --soft:#f0eee8; --danger:#b4463c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17150f; --card:#201d16; --ink:#efece4; --muted:#9a938693;
      --muted:#948d80; --line:#2e2a20; --accent:#5aa17c; --accent-ink:#0d1a13;
      --soft:#272318; --danger:#d2766b;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:min(8vh,80px) 20px 60px;
  }
  #app{width:100%; max-width:600px}
  .masthead{text-align:center; margin-bottom:34px}
  .masthead h1{font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px}

  /* Focus / rest */
  .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 14px}
  .the-one{font-size:29px; line-height:1.25; font-weight:600; margin:0; word-break:break-word}
  .rest-head{font-size:26px; font-weight:600; margin:0 0 6px}
  .rest-sub{color:var(--muted); margin:0}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px}
  button{font:inherit; cursor:pointer; border:none; border-radius:11px; padding:13px 20px; font-weight:600}
  .btn-primary{background:var(--accent); color:var(--accent-ink)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:transparent; color:var(--muted); padding:13px 6px; font-weight:500; text-decoration:underline; text-underline-offset:3px}
  .btn-ghost:hover{color:var(--ink)}
  .btn-soft{background:var(--soft); color:var(--ink)}
  .count{color:var(--muted); font-size:13px; margin-top:22px}

  /* Capture */
  .capture{margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px}
  .capture label{display:block; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  textarea,input[type=text]{
    width:100%; font:inherit; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:11px; padding:12px 14px; resize:vertical;
  }
  textarea{min-height:64px}
  .capture .row{display:flex; gap:10px; align-items:center; margin-top:10px}
  .capture .hint{font-size:13px; color:var(--muted); flex:1}
  .saved{color:var(--accent); font-weight:600}

  /* Planning */
  .plan-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px}
  .plan-head h2{margin:0; font-size:20px}
  .add-row{display:flex; gap:10px; margin-bottom:22px}
  .add-row input{flex:1}
  .section-label{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:24px 0 10px}
  ol.line{list-style:none; margin:0; padding:0; counter-reset:n}
  ol.line li{counter-increment:n; display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line)}
  ol.line li:first-child{border-top:none}
  ol.line .num{width:24px; height:24px; flex:none; border-radius:50%; background:var(--soft); color:var(--muted); font-size:12px; font-weight:700; display:grid; place-items:center}
  ol.line li.top .num{background:var(--accent); color:var(--accent-ink)}
  .item-text{flex:1; word-break:break-word}
  .mini{background:var(--soft); color:var(--ink); border-radius:8px; padding:6px 9px; font-size:14px; font-weight:600; line-height:1}
  .mini:hover{filter:brightness(.97)}
  .mini.x{color:var(--danger)}
  .inbox li{display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line)}
  .inbox li:first-child{border-top:none}
  .empty{color:var(--muted); font-size:14px; padding:6px 0}
  .plan-foot{margin-top:28px}
  .footer-link{text-align:center; margin-top:20px}
</style>
</head>
<body>
  <div id="app"></div>

<script>
(function(){
  "use strict";
  var KEY = "oneThingList.v1";
  var planning = false;     // in-memory only: always start on the task, never peeking the list
  var savedFlash = false;

  function today(){ return new Date().toISOString().slice(0,10); }
  function uid(){ return (Date.now().toString(36) + Math.random().toString(36).slice(2,7)); }
  function defaultState(){ return { queue:[], inbox:[], mode:"focus", done:0, doneDate:today() }; }

  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY));
      if(!s || typeof s!=="object") return defaultState();
      s.queue = s.queue||[]; s.inbox = s.inbox||[];
      s.mode = s.mode||"focus"; s.done = s.done||0; s.doneDate = s.doneDate||today();
      return s;
    }catch(e){ return defaultState(); }
  }
  var state = load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function rollover(){ var t=today(); if(state.doneDate!==t){ state.done=0; state.doneDate=t; save(); } }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  var app = document.getElementById("app");

  function captureHTML(){
    return ''+
      '<div class="capture">'+
        '<label for="thought">Park a thought for later</label>'+
        '<textarea id="thought" placeholder="Jot anything down &mdash; it goes to your inbox, out of your way. You’ll sort it at planning time."></textarea>'+
        '<div class="row">'+
          '<span class="hint" id="caphint">'+ (savedFlash ? '<span class="saved">Saved to inbox ✓</span>' : (state.inbox.length ? (state.inbox.length+' waiting in your inbox') : 'Nothing in the inbox yet')) +'</span>'+
          '<button class="btn-soft" id="saveThought">Save</button>'+
        '</div>'+
      '</div>';
  }

  function planFooterLink(){
    return '<div class="footer-link"><button class="btn-ghost" id="toPlan">Planning mode</button></div>';
  }

  function render(){
    rollover();
    var h = '<div class="masthead"><h1>The One Thing List</h1></div>';

    if(planning){ h += planningHTML(); }
    else if(state.queue.length === 0){ h += emptyHTML() + captureHTML() + planFooterLink(); }
    else if(state.mode === "rest"){ h += restHTML() + captureHTML() + planFooterLink(); }
    else { h += focusHTML() + captureHTML() + planFooterLink(); }

    app.innerHTML = h;
    wire();
    savedFlash = false;
  }

  function focusHTML(){
    var t = state.queue[0];
    var canDefer = state.queue.length > 1;
    return ''+
      '<div class="card">'+
        '<p class="eyebrow">Your one thing</p>'+
        '<p class="the-one">'+ esc(t.text) +'</p>'+
        '<div class="actions">'+
          '<button class="btn-primary" id="done">Done</button>'+
          (canDefer ? '<button class="btn-ghost" id="defer">Can’t right now &mdash; send to the back</button>' : '')+
        '</div>'+
      '</div>';
  }

  function restHTML(){
    var more = state.queue.length > 0;
    return ''+
      '<div class="card">'+
        '<p class="rest-head">You’re done ✓</p>'+
        '<p class="rest-sub">'+ (more ? 'Tap when you’re ready for the next one.' : 'That was the last one in the line. Nice.') +'</p>'+
        '<div class="actions">'+
          (more ? '<button class="btn-primary" id="next">Next task</button>' : '<button class="btn-soft" id="toPlan2">Line up what’s next</button>')+
        '</div>'+
        (state.done ? '<p class="count">'+ state.done +' cleared today</p>' : '')+
      '</div>';
  }

  function emptyHTML(){
    return ''+
      '<div class="card">'+
        '<p class="rest-head">The line is empty</p>'+
        '<p class="rest-sub">Open planning to line up what matters next.</p>'+
        '<div class="actions"><button class="btn-primary" id="toPlan2">Open planning</button></div>'+
        (state.done ? '<p class="count">'+ state.done +' cleared today</p>' : '')+
      '</div>';
  }

  function planningHTML(){
    var line = '';
    if(state.queue.length === 0){ line = '<p class="empty">No tasks yet. Add the first one above.</p>'; }
    else {
      line = '<ol class="line">';
      state.queue.forEach(function(it, i){
        var top = i===0 ? ' top' : '';
        line += '<li class="'+top.trim()+'">'+
          '<span class="num">'+(i+1)+'</span>'+
          '<span class="item-text">'+ esc(it.text) +'</span>'+
          (i>0 ? '<button class="mini" data-act="totop" data-id="'+it.id+'" title="Make this #1">⇧#1</button>' : '')+
          (i>0 ? '<button class="mini" data-act="up" data-id="'+it.id+'" title="Up">↑</button>' : '')+
          (i<state.queue.length-1 ? '<button class="mini" data-act="down" data-id="'+it.id+'" title="Down">↓</button>' : '')+
          '<button class="mini x" data-act="del" data-id="'+it.id+'" title="Remove">✕</button>'+
        '</li>';
      });
      line += '</ol>';
    }

    var inbox = '';
    if(state.inbox.length === 0){ inbox = '<p class="empty">Inbox is empty.</p>'; }
    else {
      inbox = '<ul class="inbox">';
      state.inbox.forEach(function(it){
        inbox += '<li>'+
          '<span class="item-text">'+ esc(it.text) +'</span>'+
          '<button class="mini" data-act="promote" data-id="'+it.id+'" title="Add to the line">&rarr; line</button>'+
          '<button class="mini x" data-act="trash" data-id="'+it.id+'" title="Discard">✕</button>'+
        '</li>';
      });
      inbox += '</ul>';
    }

    return ''+
      '<div class="card">'+
        '<div class="plan-head"><h2>Planning</h2></div>'+
        '<div class="add-row">'+
          '<input type="text" id="newTask" placeholder="Add a task to the line…" autocomplete="off">'+
          '<button class="btn-primary" id="addTask">Add</button>'+
        '</div>'+
        '<p class="section-label">The line — top is your one thing</p>'+
        line +
        '<p class="section-label">Inbox — thoughts to sort</p>'+
        inbox +
        '<div class="plan-foot actions"><button class="btn-soft" id="closePlan">Back to my one thing</button></div>'+
      '</div>';
  }

  // ---- actions ----
  function wire(){
    var q = function(id){ return document.getElementById(id); };

    if(q("done")) q("done").onclick = function(){
      state.queue.shift(); state.done += 1; state.doneDate = today();
      state.mode = "rest"; save(); render();
    };
    if(q("defer")) q("defer").onclick = function(){
      var t = state.queue.shift(); state.queue.push(t); save(); render();
    };
    if(q("next")) q("next").onclick = function(){ state.mode="focus"; save(); render(); };
    if(q("toPlan")) q("toPlan").onclick = openPlan;
    if(q("toPlan2")) q("toPlan2").onclick = function(){ planning=true; render(); };

    if(q("saveThought")) q("saveThought").onclick = function(){
      var el = q("thought"); var v = (el.value||"").trim();
      if(!v) return;
      state.inbox.push({id:uid(), text:v}); save();
      savedFlash = true; render();
    };

    if(q("addTask")){
      var add = function(){
        var el=q("newTask"); var v=(el.value||"").trim(); if(!v) return;
        state.queue.push({id:uid(), text:v}); save(); render();
        var n=document.getElementById("newTask"); if(n) n.focus();
      };
      q("addTask").onclick = add;
      q("newTask").onkeydown = function(e){ if(e.key==="Enter") add(); };
    }
    if(q("closePlan")) q("closePlan").onclick = function(){
      planning=false; if(state.mode!=="rest") state.mode="focus"; render();
    };

    Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function(b){
      b.onclick = function(){ handle(b.getAttribute("data-act"), b.getAttribute("data-id")); };
    });
  }

  function openPlan(){
    if(window.confirm("Open planning? This reveals your whole list.")){ planning=true; render(); }
  }

  function idx(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return i; } return -1; }

  function handle(act, id){
    var i = idx(state.queue, id);
    if(act==="up" && i>0){ var a=state.queue; var t=a[i]; a[i]=a[i-1]; a[i-1]=t; }
    else if(act==="down" && i>-1 && i<state.queue.length-1){ var b=state.queue; var u=b[i]; b[i]=b[i+1]; b[i+1]=u; }
    else if(act==="totop" && i>0){ var c=state.queue.splice(i,1)[0]; state.queue.unshift(c); }
    else if(act==="del" && i>-1){ state.queue.splice(i,1); }
    else if(act==="promote"){ var j=idx(state.inbox,id); if(j>-1){ state.queue.push(state.inbox.splice(j,1)[0]); } }
    else if(act==="trash"){ var k=idx(state.inbox,id); if(k>-1){ state.inbox.splice(k,1); } }
    save(); render();
  }

  render();
})();
</script>
</body>
</html>
